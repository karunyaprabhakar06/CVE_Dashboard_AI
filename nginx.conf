# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── Hide server info ────────────────────────────────────────────────
  server_tokens off;

  # ─── Request limits ──────────────────────────────────────────────────
  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 10s;

  # ─── Security headers ────────────────────────────────────────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ─── Block bad HTTP methods ──────────────────────────────────────────
  if ($request_method !~ ^(GET|POST|OPTIONS|HEAD)$) {
    return 405;
  }

  # ─── Block SQL injection patterns ────────────────────────────────────
  set $sqli_block 0;
  if ($query_string ~* "(union|select|insert|update|delete|drop|truncate|alter|exec|execute|cast|convert|char|declare|waitfor|benchmark|sleep)[\s\(]") {
    set $sqli_block 1;
  }
  if ($query_string ~* "('|%27|--|%2d%2d|;|%3b|\/\*|\*\/)") {
    set $sqli_block 1;
  }
  if ($query_string ~* "(or|and)\s+\d+=\d+") {
    set $sqli_block 1;
  }
  if ($sqli_block = 1) {
    return 403;
  }

  # ─── Block common attack patterns in URI ─────────────────────────────
  if ($request_uri ~* "(\.\.\/|\.\.\\|%2e%2e%2f|%2e%2e\/|\.\.%2f)") {
    return 403;
  }
  if ($request_uri ~* "\.(sh|bash|py|pl|php|asp|aspx|jsp|cgi)$") {
    return 403;
  }

  # ─── Block suspicious user agents ────────────────────────────────────
  if ($http_user_agent ~* "(nikto|sqlmap|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|wfuzz|hydra|burpsuite)") {
    return 403;
  }

  # ─── Gzip ────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
  gzip_min_length 1024;

  # ─── Static assets ───────────────────────────────────────────────────
  location /assets/ {
    limit_req zone=general burst=50 nodelay;
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ─── API proxy ───────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api burst=10 nodelay;

    if ($query_string ~* "(union|select|insert|update|delete|drop|exec|sleep|benchmark|waitfor)[\s\(]") {
      return 403;
    }

    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  # ─── Block access to hidden files ────────────────────────────────────
  location ~ /\. {
    deny all;
    return 404;
  }

  # ─── SPA fallback ────────────────────────────────────────────────────
  location / {
    limit_req zone=general burst=20 nodelay;
    try_files $uri $uri/ /index.html;
  }

  # ─── Block favicon/robots spam ───────────────────────────────────────
  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }
}
